<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Packet Foundry logo: an anvil forging a packet of bits">
  <defs>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6270"/>
      <stop offset="1" stop-color="#3a3f4c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8fff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#1b1d21"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="#3a3f4c" stroke-width="4"/>

  <!-- the packet being forged: a byte of bit cells, 0 1 0 0 1 0 1 1 -->
  <g transform="translate(48,52)">
    <rect x="-6" y="-6" width="172" height="40" rx="10" fill="none" stroke="url(#glow)" stroke-width="4"/>
    <!-- bits: filled = 1 (blue/violet), outlined = 0 -->
    <rect x="2"   y="2" width="16" height="24" rx="4" fill="none" stroke="#5b8fff" stroke-width="3"/>
    <rect x="22"  y="2" width="16" height="24" rx="4" fill="#5b8fff"/>
    <rect x="42"  y="2" width="16" height="24" rx="4" fill="none" stroke="#5b8fff" stroke-width="3"/>
    <rect x="62"  y="2" width="16" height="24" rx="4" fill="none" stroke="#7d8494" stroke-width="3"/>
    <rect x="82"  y="2" width="16" height="24" rx="4" fill="#a78bfa"/>
    <rect x="102" y="2" width="16" height="24" rx="4" fill="none" stroke="#7d8494" stroke-width="3"/>
    <rect x="122" y="2" width="16" height="24" rx="4" fill="#5b8fff"/>
    <rect x="142" y="2" width="16" height="24" rx="4" fill="#a78bfa"/>
  </g>

  <!-- sparks -->
  <g fill="#f0c674">
    <path d="M96 118 l6 10 -6 10 -6 -10 z"/>
    <path d="M156 112 l5 8 -5 8 -5 -8 z" fill="#a78bfa"/>
    <path d="M126 108 l4 7 -4 7 -4 -7 z" fill="#5b8fff"/>
  </g>

  <!-- anvil -->
  <g fill="url(#anvil)">
    <!-- horn + face -->
    <path d="M52 138
             q-18 2 -22 14 q14 8 34 6 l0 10 q0 6 6 6 l16 0
             l0 12 q0 4 -4 6 q-16 6 -16 14 l124 0 q0 -8 -16 -14 q-4 -2 -4 -6 l0 -12 l16 0
             q28 0 42 -22 q4 -8 -4 -12 q-10 -4 -24 -2 z"/>
    <!-- base -->
    <path d="M84 208 l88 0 q10 0 10 10 l0 4 -108 0 0 -4 q0 -10 10 -10 z"/>
  </g>
  <!-- glow line on the anvil face -->
  <rect x="52" y="138" width="152" height="6" rx="3" fill="url(#glow)" opacity="0.9"/>
</svg>
