[workspace]
resolver = "3"
members = [
    "crates/packet-core",
    "crates/protocol-engine",
    "crates/packet-cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"

[profile.release]
lto = true
